<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Direct Connect, up close — AWS Connectivity</title>
    <meta
      name="description"
      content="AWS Direct Connect in depth: connections, LAG and MACsec, virtual interfaces, Direct Connect gateway, BGP, resiliency, security, operations and pricing, each with a lab. Bilingual (EN/JA)."
    />
    <meta name="theme-color" content="#006b4f" />
    <script>
      // Apply a saved theme before first paint so it never flashes.
      try {
        const t = localStorage.getItem("aws-connectivity:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/direct-connect.tsx"></script>
  </body>
</html>
